# depth2lidar pipeline configuration for nuScenes

dataset:
  dataroot: /home/max/Phd/Phase1/Sparse4D/data  # Path to nuScenes root directory
  version: v1.0-mini             # v1.0-mini | v1.0-trainval | v1.0-test
  cameras:                       # Cameras to use (all 6 by default)
    - CAM_FRONT
    - CAM_FRONT_LEFT
    - CAM_FRONT_RIGHT
    - CAM_BACK
    - CAM_BACK_LEFT
    - CAM_BACK_RIGHT

depth_estimator:
  # HuggingFace model ID or local path
  model_id: depth-anything/Depth-Anything-V2-Metric-Outdoor-Large-hf
  device: auto                   # auto | cuda | cpu
  max_depth: 60.0                # Clip depth at this value (meters)
  align_to_lidar: false          # Scale-shift align to sparse LiDAR GT

back_projection:
  min_depth: 0.5                 # Discard points closer than this (meters)
  max_depth: 60.0                # Discard points farther than this (meters)

point_cloud_filter:
  # BEV range (ego frame): X=forward, Y=left
  x_range: [-51.2, 51.2]
  y_range: [-51.2, 51.2]
  z_range: [-5.0, 3.0]          # Height filter (removes ground/sky artefacts)
  voxel_size: 0.1               # Voxel downsampling grid size (meters)

output:
  format: bin                    # bin (XYZI float32) — compatible with BEVFusion/CenterPoint
  output_dir: ./output
